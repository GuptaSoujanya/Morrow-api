# Optional overlay for Firebase Admin credentials on non-Google hosts.
# docker compose -f compose.yaml -f compose.firebase.yaml up -d --build
services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
    secrets: [firebase_admin]
  admin:
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
    secrets: [firebase_admin]
secrets:
  firebase_admin:
    file: ${FIREBASE_CREDENTIALS_FILE:?Set the private Firebase Admin JSON file path}
