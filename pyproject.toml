[project]
name = "morrow-api"
version = "0.1.0"
description = "Morrow's authenticated multi-user API and private storage service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "PyYAML>=6,<7",
  "authlib>=1.4,<2",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "stripe>=12,<15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "moto[s3]>=5,<6"]

[project.scripts]
morrow = "morrow_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
